<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
renderVals() {
let seed = 11;
const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
const W = 850, R = 3, B = 4, x0 = 40, bw = (W - x0 - 10) / B;
const flags = { '0-2': 'bad', '1-1': 'check' };
const rows = [];
for (let r = 0; r < R; r++) {
const bars = [], notes = [];
for (let b = 0; b < B; b++) {
const f = flags[r + '-' + b];
const left = x0 + b * bw;
bars.push({ left: left + 2, width: bw - 4, right: Math.round(left + bw), lx: left + 6, bg: f === 'bad' ? '#FDE8E6' : f === 'check' ? '#FFF1D6' : 'transparent',
nc: f === 'bad' ? '#C2362B' : f === 'check' ? '#8A5300' : '#4E647C', label: (r * B + b + 1) + (f === 'bad' ? '  ▲' : f === 'check' ? '  ●' : '') });
const start = left + (b === 0 ? 50 : 16), step = (bw - (b === 0 ? 62 : 30)) / 4;
for (let k = 0; k < 4; k++) {
const x = Math.round(start + k * step + step / 2);
const y = Math.round(rnd() * 8) * 5 - 4;
const isSel = r === 0 && b === 2 && k === 1;
const c = isSel ? '#1769C2' : '#0E2238';
notes.push({ x, y, c, sx: x + 10, st: y - 26, ring: isSel, rx: x - 8, ry: y - 10 });
if (k % 2 === 0) { const y2 = 90 + Math.round(rnd() * 8) * 5 - 4; notes.push({ x, y: y2, c: '#0E2238', sx: x + 10, st: y2 - 26, ring: false, rx: 0, ry: 0 }); }
}
}
rows.push({ bars, notes });
}
return { rows };
}
}
</script>
