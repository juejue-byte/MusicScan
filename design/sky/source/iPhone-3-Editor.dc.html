<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F56A3}a:hover{color:#0E2238}
.disp{font-family:Nunito,ui-rounded,system-ui,sans-serif}
.ib{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;color:#0E2238;text-decoration:none}
.staff{position:absolute;left:16px;right:8px;height:33px;background:repeating-linear-gradient(#0E2238 0 1px,transparent 1px 8px)}
.k{display:grid;place-items:center;flex:none;min-width:48px;height:48px;padding:0 10px;border-radius:12px;background:#FFFFFF;border:1px solid #D6E4F2;font-size:15px;font-weight:600;color:#0E2238}
.g{font-family:"Noto Music","Apple Symbols",serif;font-size:24px;font-weight:400}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5FAFF;font-family:Inter,system-ui,sans-serif;color:#0E2238;display:flex;flex-direction:column">
<div style="padding:54px 8px 8px;display:flex;align-items:center;gap:4px;background:#EAF4FE">
<a class="ib" href="iPhone-1-Library.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<b class="disp" style="font-size:17px;font-weight:800;flex:1">Sonatina in C</b>
<a href="iPad-6-FixIt.dc.html" style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;background:#D8EAFC;color:#0F56A3;font-size:14px;font-weight:600;text-decoration:none">Fix it<span style="display:grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:#C2362B;color:#FFFFFF;font-size:11px">2</span></a>
<a class="ib" href="iPhone-4-Practice.dc.html" aria-label="Play" style="background:#1769C2;color:#FFFFFF;margin-left:6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg></a>
</div>
<div style="flex:1;margin:10px 8px 0;border-radius:18px;background:#FFFFFF;box-shadow:0 6px 20px rgba(23,105,194,.08);overflow:hidden;padding-top:4px">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="4">
<div style="position:relative;height:120px;margin-top:30px">
<sc-for list="{{row.bars}}" as="bar" hint-placeholder-count="2">
<div style="position:absolute;left:{{bar.left}}px;width:{{bar.width}}px;top:-10px;height:118px;background:{{bar.bg}};border-radius:6px"></div>
<span style="position:absolute;left:{{bar.lx}}px;top:-24px;font-size:10px;font-weight:700;color:{{bar.nc}}">{{bar.label}}</span>
<div style="position:absolute;left:{{bar.right}}px;top:0;width:1px;height:105px;background:#0E2238"></div>
</sc-for>
<div class="staff" style="top:0"></div>
<div class="staff" style="top:72px"></div>
<div style="position:absolute;left:16px;top:0;width:1px;height:105px;background:#0E2238"></div>
<sc-for list="{{row.notes}}" as="n" hint-placeholder-count="10">
<div style="position:absolute;left:{{n.x}}px;top:{{n.y}}px;width:10px;height:8px;border-radius:50%;background:{{n.c}};transform:rotate(-20deg)"></div>
<div style="position:absolute;left:{{n.sx}}px;top:{{n.st}}px;width:1.3px;height:24px;background:{{n.c}}"></div>
<sc-if value="{{n.ring}}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:{{n.rx}}px;top:{{n.ry}}px;width:24px;height:24px;border-radius:50%;border:3px solid #5FAEEB;box-sizing:border-box"></div></sc-if>
</sc-for>
</div>
</sc-for>
</div>
<div style="padding:10px 8px 30px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;align-items:center;padding:0 6px;font-size:13px;color:#4E647C"><span>G4 · quarter · bar 3</span><span style="display:flex;gap:2px"><a class="ib" href="#" aria-label="Undo" style="width:36px;height:36px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></a><a class="ib" href="#" aria-label="Redo" style="width:36px;height:36px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></a></span></div>
<div style="display:flex;gap:6px;overflow:hidden">
<span class="k g">𝅗𝅥</span><span class="k g" style="background:#D8EAFC;border-color:#B9D9F7;color:#0F56A3">♩</span><span class="k g">♪</span><span class="k" style="font-size:22px">·</span><span class="k">Rest</span><span class="k g">♭</span><span class="k g">♯</span><span class="k">More</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
let seed = 5;
const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
const W = 372, R = 4, B = 2, x0 = 16, bw = (W - x0 - 8) / B;
const flags = { '1-0': 'bad', '2-1': 'check' };
const rows = [];
for (let r = 0; r < R; r++) {
const bars = [], notes = [];
for (let b = 0; b < B; b++) {
const f = flags[r + '-' + b], left = x0 + b * bw;
bars.push({ left: left + 2, width: bw - 4, right: Math.round(left + bw), lx: left + 4, bg: f === 'bad' ? '#FDE8E6' : f === 'check' ? '#FFF1D6' : 'transparent',
nc: f === 'bad' ? '#C2362B' : f === 'check' ? '#8A5300' : '#4E647C', label: (r * B + b + 1) + (f === 'bad' ? ' ▲' : f === 'check' ? ' ●' : '') });
const start = left + (b === 0 ? 30 : 10), step = (bw - (b === 0 ? 40 : 20)) / 4;
for (let k = 0; k < 4; k++) {
const x = Math.round(start + k * step + step / 2), y = Math.round(rnd() * 8) * 4 - 3;
const isSel = r === 1 && b === 1 && k === 0;
const c = isSel ? '#1769C2' : '#0E2238';
notes.push({ x, y, c, sx: x + 8, st: y - 20, ring: isSel, rx: x - 7, ry: y - 8 });
if (k % 2 === 0) { const y2 = 72 + Math.round(rnd() * 8) * 4 - 3; notes.push({ x, y: y2, c: '#0E2238', sx: x + 8, st: y2 - 20, ring: false, rx: 0, ry: 0 }); }
}
}
rows.push({ bars, notes });
}
return { rows };
}
}
</script>
</body>
</html>
