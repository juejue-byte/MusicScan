<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading the page</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F56A3}a:hover{color:#0E2238}
.disp{font-family:Nunito,ui-rounded,system-ui,sans-serif}
.st{display:flex;align-items:center;gap:12px;font-size:16px;color:#4E647C}
.dot{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;flex:none}
</style>
</head>
<body>
<div style="width:1194px;height:834px;box-sizing:border-box;background:#F5FAFF;font-family:Inter,system-ui,sans-serif;color:#0E2238;display:flex;align-items:center;justify-content:center;gap:64px">
<div style="position:relative;width:430px;height:600px;border-radius:14px;background:#FFFFFF;box-shadow:0 2px 6px rgba(14,34,56,.06),0 24px 60px rgba(23,105,194,.16);overflow:hidden">
<svg width="430" height="600" viewBox="0 0 430 600" aria-hidden="true" style="position:absolute;inset:0"><g stroke="#0E2238" stroke-width="1.2" opacity=".75"><path d="M30 70h370M30 78h370M30 86h370M30 94h370M30 102h370M30 128h370M30 136h370M30 144h370M30 152h370M30 160h370"/><path d="M30 210h370M30 218h370M30 226h370M30 234h370M30 242h370M30 268h370M30 276h370M30 284h370M30 292h370M30 300h370"/><path d="M30 350h370M30 358h370M30 366h370M30 374h370M30 382h370M30 408h370M30 416h370M30 424h370M30 432h370M30 440h370"/><path d="M30 490h370M30 498h370M30 506h370M30 514h370M30 522h370M30 548h370M30 556h370M30 564h370M30 572h370M30 580h370"/></g></svg>
<div style="position:absolute;left:14px;right:14px;top:56px;height:118px;border-radius:10px;background:rgba(30,142,90,.10);border:2px solid #7CC9A2"></div>
<div style="position:absolute;left:14px;right:14px;top:196px;height:118px;border-radius:10px;background:rgba(30,142,90,.10);border:2px solid #7CC9A2"></div>
<div style="position:absolute;left:14px;right:14px;top:336px;height:118px;border-radius:10px;background:rgba(95,174,235,.16);border:2px solid #1769C2"></div>
<div style="position:absolute;left:14px;right:14px;top:396px;height:3px;background:#1769C2;box-shadow:0 0 16px #5FAEEB"></div>
</div>
<div style="width:400px;display:flex;flex-direction:column;gap:22px">
<h1 class="disp" style="margin:0;font-size:34px;font-weight:900;letter-spacing:-.02em">Reading your page…</h1>
<div style="display:flex;flex-direction:column;gap:14px">
<div class="st" style="color:#0E2238"><span class="dot" style="background:#1D7A4E"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg></span>Straightened and cleaned</div>
<div class="st" style="color:#0E2238"><span class="dot" style="background:#1D7A4E"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg></span>Found 4 rows, piano</div>
<div class="st" style="color:#0E2238;font-weight:600"><span class="dot" style="border:3px solid #1769C2;box-sizing:border-box"></span>Reading row 3 of 4</div>
<div class="st"><span class="dot" style="border:2px solid #B9D9F7;box-sizing:border-box"></span>Double-checking tricky bars</div>
</div>
<div style="height:10px;border-radius:99px;background:#EAF4FE"><div style="width:64%;height:10px;border-radius:99px;background:#1769C2"></div></div>
<div style="font-size:14px;color:#4E647C">About 8 seconds left</div>
<div style="padding:16px;border-radius:18px;background:#EAF4FE;font-size:15px;line-height:1.45"><b>While you wait:</b> bars we're unsure about get a red or amber flag. You'll fix them in one pass with <b>Fix it</b>, usually under a minute.</div>
</div>
</div>
</body>
</html>
