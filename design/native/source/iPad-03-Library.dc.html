<style>

.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px}
</style>

<div style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:24px 22px;margin-top:6px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="7">
<a class="card" href="{{it.href}}">
<div class="thumb"><img src="{{it.img}}" alt=""></div>
<div style="display:flex;flex-direction:column;gap:5px;padding:0 2px">
<b style="font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{it.title}}</b>
<span style="font-size:13px;color:#4E647C">{{it.sub}}</span>
<span class="pill" style="{{it.pillStyle}}"><span style="{{it.dotStyle}}"></span>{{it.status}}</span>
</div>
</a>
</sc-for>
