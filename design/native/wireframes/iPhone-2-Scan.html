<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone scan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#D8EAFC}
.cb{width:46px;height:46px;border-radius:99px;display:grid;place-items:center;color:#FFFFFF;background:rgba(14,34,56,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.18);text-decoration:none;cursor:pointer;padding:0}
</style>
</head>
<body>
<div style="position:relative;width:390px;height:844px;background:#0B1B2C;font-family:Inter,system-ui,sans-serif;color:#FFFFFF;overflow:hidden">
<img src="../assets/photo_k545.jpg" alt="" aria-hidden="true" style="position:absolute;inset:-40px;width:470px;height:924px;object-fit:cover;filter:blur(24px) brightness(.7)">
<img src="../assets/photo_k545.jpg" alt="Live camera view of a printed piano page" style="position:absolute;left:0;top:110px;width:390px;height:530px">
<svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position:absolute;inset:0">
<polygon points="27,145 348,152 352,582 40,600" fill="rgba(95,174,235,.16)" stroke="#5FAEEB" stroke-width="2.5" stroke-linejoin="round"/>
<g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M27 175v-30h30"/><path d="M318 151l30 1v30"/><path d="M352 552v30h-30"/><path d="M70 598l-30 2v-30"/></g>
</svg>
<a class="cb" href="iPhone-1-Library.html" aria-label="Close camera" style="position:absolute;left:18px;top:56px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<button class="cb" aria-label="Flash: auto" style="position:absolute;right:18px;top:56px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 3L5 13.5h6L10 21l9-11h-6.2z"/></svg></button>
<div style="position:absolute;left:50%;top:620px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 6px;border-radius:99px;background:rgba(14,34,56,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.18);font-size:14px;font-weight:600;white-space:nowrap"><span style="width:26px;height:26px;border-radius:99px;background:#1D7A4E;display:grid;place-items:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg></span>Page found · hold still</div>
<div style="position:absolute;left:0;right:0;bottom:44px;display:flex;align-items:center;justify-content:space-between;padding:0 40px">
<button class="cb" aria-label="Choose from Photos" style="width:52px;height:52px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 8"/></svg></button>
<a href="iPhone-3-Editor.html" aria-label="Take photo" style="width:82px;height:82px;border-radius:99px;border:5px solid #FFFFFF;display:grid;place-items:center;box-sizing:border-box"><span style="width:64px;height:64px;border-radius:99px;background:#FFFFFF;display:block"></span></a>
<span style="width:52px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#BFD7EE"><span style="width:8px;height:8px;border-radius:99px;background:#5FAEEB"></span>Auto</span>
</div>
</div>
</body>
</html>
