<style>
body{margin:0}

</style>
</head>
<body>

<div role="toolbar" aria-label="Note palette" style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:10px 12px 34px;border-radius:24px 24px 0 0;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid #D6E4F2;box-shadow:0 -8px 30px rgba(23,105,194,.10);display:flex;flex-direction:column;gap:6px">
<div style="display:flex;align-items:center;gap:6px">

<button class="ib" aria-label="Undo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>

<button class="tool on" aria-label="Quarter note"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="9.6" cy="17.5" rx="4.3" ry="3.1" transform="rotate(-22 9.6 17.5)" fill="currentColor"/><path d="M13.6 16.5V3" stroke="currentColor" stroke-width="1.8"/></svg></button>
<button class="tool" aria-label="Eighth note"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="8.6" cy="17.5" rx="4.3" ry="3.1" transform="rotate(-22 8.6 17.5)" fill="currentColor"/><path d="M12.6 16.5V3c0 3.5 6 4.5 5 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
<button class="tool" aria-label="Sixteenth note"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="8.6" cy="17.5" rx="4.3" ry="3.1" transform="rotate(-22 8.6 17.5)" fill="currentColor"/><path d="M12.6 16.5V3c0 3 5.5 3.5 5 8M12.6 7.5c0 3 5.5 3.5 5 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
<button class="tool" aria-label="Dot"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="2.6" fill="currentColor"/></svg></button>
<button class="tool" aria-label="Make it a rest"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2.5l4.6 5.2-3.3 3.6 4.1 4.7c-2.6-1-4.6.2-2.6 3.8-3.6-2.2-3.8-5-.8-5.6L8.6 9.2l3.2-3.5z" fill="currentColor"/></svg></button>
<button class="tool" aria-label="Flat">♭</button>
<button class="tool" aria-label="Natural">♮</button>
<button class="tool" aria-label="Sharp">♯</button>
<button class="tool" aria-label="Tie"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 11c3 5 13 5 16 0"/></svg></button>
<button class="tool" aria-label="Bar and rhythm tools"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg></button>
