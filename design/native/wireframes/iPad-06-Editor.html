<!doctype html>

<title>Edit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F56A3}a:hover{color:#0E2238}
.d{font-family:Nunito,ui-rounded,system-ui,sans-serif}
.glass{background:rgba(255,255,255,.82);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(255,255,255,.95);box-shadow:0 1px 2px rgba(14,34,56,.06),0 10px 30px rgba(23,105,194,.14)}
.ib{width:46px;height:46px;border-radius:99px;display:grid;place-items:center;color:#1769C2;text-decoration:none;border:0;background:transparent;cursor:pointer;padding:0;font:600 22px Inter,system-ui,sans-serif}
.tool{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;color:#0E2238;border:0;background:transparent;cursor:pointer;padding:0;font:500 26px 'Times New Roman',serif}
.tool.on{background:#D8EAFC;color:#0F56A3}
.sep{width:1px;height:30px;background:#C9DDF1;margin:0 6px}
.seg{height:40px;padding:0 16px;border-radius:99px;border:0;background:transparent;font:600 15px Inter,system-ui,sans-serif;color:#4E647C;cursor:pointer}
.seg.on{background:#FFFFFF;color:#0E2238;box-shadow:0 1px 3px rgba(14,34,56,.15)}
</style>
</head>

</div>

</div>
<div class="glass" role="toolbar" aria-label="Note palette" style="position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;height:68px;padding:0 10px;border-radius:24px">
<div style="display:flex;padding:4px;border-radius:99px;background:#EAF4FE;margin-right:8px"><button class="seg on">Notes</button><button class="seg">Marks</button><button class="seg">Ink</button></div>
<button class="tool" aria-label="Whole note"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="13" rx="5.6" ry="3.8" fill="none" stroke="currentColor" stroke-width="2.4"/></svg></button>
<button class="tool" aria-label="Half note"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="9.6" cy="17.5" rx="4.3" ry="3.1" transform="rotate(-22 9.6 17.5)" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13.6 16.5V3" stroke="currentColor" stroke-width="1.8"/></svg></button>
<button class="tool on" aria-label="Quarter note" aria-pressed="true"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="9.6" cy="17.5" rx="4.3" ry="3.1" transform="rotate(-22 9.6 17.5)" fill="currentColor"/><path d="M13.6 16.5V3" stroke="currentColor" stroke-width="1.8"/></svg></button>
<button class="tool" aria-label="Eighth note"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="8.6" cy="17.5" rx="4.3" ry="3.1" transform="rotate(-22 8.6 17.5)" fill="currentColor"/><path d="M12.6 16.5V3c0 3.5 6 4.5 5 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
<button class="tool" aria-label="Sixteenth note"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="8.6" cy="17.5" rx="4.3" ry="3.1" transform="rotate(-22 8.6 17.5)" fill="currentColor"/><path d="M12.6 16.5V3c0 3 5.5 3.5 5 8M12.6 7.5c0 3 5.5 3.5 5 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
<button class="tool" aria-label="Dot"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="2.6" fill="currentColor"/></svg></button>
<span class="sep"></span>

<span class="sep"></span>
<button class="tool" aria-label="Flat">♭</button>
<button class="tool" aria-label="Natural">♮</button>
<button class="tool" aria-label="Sharp">♯</button>
<span class="sep"></span>
<button class="tool" aria-label="Tie"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 11c3 5 13 5 16 0"/></svg></button>
<button class="tool" aria-label="Bar and rhythm tools"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg></button>
